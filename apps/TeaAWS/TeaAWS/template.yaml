AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Tea Time suburb chat websocket backend

Parameters:
  ChatTableName:
    Type: String
    Default: TeaChat
    MinLength: 3
    MaxLength: 50
    AllowedPattern: "^[A-Za-z_]+$"

  ProfilesTableName:
    Type: String
    Default: TeaProfiles
    MinLength: 3
    MaxLength: 50
    AllowedPattern: "^[A-Za-z_]+$"

  CognitoUserPoolId:
    Type: String
    Description: Cognito user pool id used to validate websocket id tokens.

  CognitoRegion:
    Type: String
    Default: ap-southeast-2

  CognitoClientId:
    Type: String
    Default: ""
    Description: Optional Cognito app client id to enforce audience validation.

  ConnectionTtlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 86400

  PersistMessageHistory:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  PlaceIndexName:
    Type: String
    Default: TeaTimePlaces
    MinLength: 1
    MaxLength: 100
    Description: Name for the Amazon Location place index used to resolve coordinates to suburbs.

Resources:

  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ChatTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProfilesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  AvatarBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldAvatarVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  PlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: !Ref PlaceIndexName
      Description: Tea Time reverse-geocoding place index
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: SingleUse

  OnConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::OnConnectHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource:
              - !GetAtt ChatTable.Arn
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CONNECTION_TTL_SECONDS: !Ref ConnectionTtlSeconds
          PERSIST_MESSAGE_HISTORY: !Ref PersistMessageHistory

  OnDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::OnDisconnectHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ChatTable.Arn
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CONNECTION_TTL_SECONDS: !Ref ConnectionTtlSeconds
          PERSIST_MESSAGE_HISTORY: !Ref PersistMessageHistory

  SendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::SendMessageHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ChatTable.Arn
              - !GetAtt ProfilesTable.Arn
              - !Sub ${ChatTable.Arn}/index/GSI1
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource:
              - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SimpleChatWebSocketApi}/*/POST/@connections/*
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CONNECTION_TTL_SECONDS: !Ref ConnectionTtlSeconds
          PERSIST_MESSAGE_HISTORY: !Ref PersistMessageHistory

  HeartbeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::OnHeartbeatHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt ChatTable.Arn
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CONNECTION_TTL_SECONDS: !Ref ConnectionTtlSeconds
          PERSIST_MESSAGE_HISTORY: !Ref PersistMessageHistory

  SetLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::SetLocationHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt ChatTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - geo:SearchPlaceIndexForPosition
            Resource: !GetAtt PlaceIndex.Arn
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CONNECTION_TTL_SECONDS: !Ref ConnectionTtlSeconds
          PERSIST_MESSAGE_HISTORY: !Ref PersistMessageHistory
          PLACE_INDEX_NAME: !Ref PlaceIndexName
      Events:
        Location:
          Type: Api
          Properties:
            Path: /location
            Method: post

  GetRecentMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::GetRecentMessagesHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:BatchGetItem
            Resource:
              - !GetAtt ChatTable.Arn
              - !GetAtt ProfilesTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        RecentMessages:
          Type: Api
          Properties:
            Path: /rooms/{roomId}/messages
            Method: get

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::GetProfileHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt ProfilesTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        Profile:
          Type: Api
          Properties:
            Path: /profile
            Method: get

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::UpdateProfileHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt ProfilesTable.Arn
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        Profile:
          Type: Api
          Properties:
            Path: /profile
            Method: put

  AvatarUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::CreateAvatarUploadUrlHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        AvatarUploadUrl:
          Type: Api
          Properties:
            Path: /profile/avatar/upload-url
            Method: post

  CompleteAvatarUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::CompleteAvatarUploadHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt ProfilesTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        AvatarComplete:
          Type: Api
          Properties:
            Path: /profile/avatar/complete
            Method: post

  DeleteAvatarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: TeaAWS::TeaAWS.Functions::DeleteAvatarHandler
      Runtime: dotnet10
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt ProfilesTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - s3:DeleteObject
            Resource: !Sub ${AvatarBucket.Arn}/profiles/*
      Environment:
        Variables:
          CHAT_TABLE: !Ref ChatTableName
          PROFILE_TABLE: !Ref ProfilesTableName
          AVATAR_BUCKET: !Ref AvatarBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Events:
        AvatarDelete:
          Type: Api
          Properties:
            Path: /profile/avatar
            Method: delete

  SimpleChatWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: SimpleChatWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.message"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnConnectFunction.Arn}/invocations

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnDisconnectFunction.Arn}/invocations

  SendMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SendMessageFunction.Arn}/invocations

  HeartbeatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HeartbeatFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join [ "/", [ "integrations", !Ref ConnectIntegration ] ]

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Join [ "/", [ "integrations", !Ref DisconnectIntegration ] ]

  SendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      RouteKey: sendMessage
      AuthorizationType: NONE
      Target: !Join [ "/", [ "integrations", !Ref SendMessageIntegration ] ]

  HeartbeatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      RouteKey: heartbeat
      AuthorizationType: NONE
      Target: !Join [ "/", [ "integrations", !Ref HeartbeatIntegration ] ]

  Deployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - SendMessageRoute
      - HeartbeatRoute
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SimpleChatWebSocketApi
      DeploymentId: !Ref Deployment
      StageName: Prod

  OnConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnConnectFunction
      Principal: apigateway.amazonaws.com

  OnDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnDisconnectFunction
      Principal: apigateway.amazonaws.com

  SendMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SendMessageFunction
      Principal: apigateway.amazonaws.com

  HeartbeatPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HeartbeatFunction
      Principal: apigateway.amazonaws.com

Outputs:
  LocationApiUrl:
    Description: Location API base URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod

  WebSocketURI:
    Description: WebSocket endpoint
    Value: !Sub >
      wss://${SimpleChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
